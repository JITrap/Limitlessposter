<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Mockup – Raum</title>
<style>
  /* Limitless Poster – Raum-Mockup. Platzhalter: {{poster}} (Datei), {{room}} (optionales Raumfoto),
     {{wall}} (Wandfarbe, z. B. #e9e4dc), {{caption}} (kleiner Text unten). Keine externen Schriften. */
  :root { --wall: {{wall|#e9e4dc}}; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #ddd; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .scene { position: relative; width: 100vw; height: 100vh; background: var(--wall, #e9e4dc); perspective: 1600px; }
  .scene.has-room { background: #000; }
  .room { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .wall-shade { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, rgba(255,255,255,.35), rgba(0,0,0,.08) 70%, rgba(0,0,0,.18)); }
  .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 22%; background: linear-gradient(#b9a58c, #8d7a62); }
  .floor::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 2px, transparent 2px 90px); }
  .skirting { position: absolute; left: 0; right: 0; bottom: 22%; height: 1.6%; background: #f4f1ea; box-shadow: 0 2px 4px rgba(0,0,0,.15); }
  .frame { position: absolute; left: 50%; top: 42%; width: 42%; aspect-ratio: 2 / 3; transform: translate(-50%, -50%) rotateY(-4deg); background: #111; padding: 1.2%; box-sizing: border-box; box-shadow: 0 30px 60px rgba(0,0,0,.35), 0 6px 12px rgba(0,0,0,.25); }
  .frame .mat { width: 100%; height: 100%; background: #fff; padding: 4%; box-sizing: border-box; }
  .frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .frame .placeholder { width: 100%; height: 100%; background: linear-gradient(135deg, #f5c542, #ff5c5c 60%, #5aa9ff); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 3vw; text-shadow: 0 2px 8px rgba(0,0,0,.3); }
  .plant { position: absolute; left: 10%; bottom: 22%; width: 12%; height: 30%; }
  .plant .pot { position: absolute; left: 25%; right: 25%; bottom: 0; height: 32%; background: #c9b29b; border-radius: 6px 6px 10px 10px; }
  .plant .leaf { position: absolute; bottom: 30%; left: 50%; width: 10%; height: 70%; background: #3f7a4a; border-radius: 50% 50% 0 0; transform-origin: bottom center; }
  .plant .leaf:nth-child(2) { transform: rotate(-28deg); } .plant .leaf:nth-child(3) { transform: rotate(28deg); } .plant .leaf:nth-child(4) { transform: rotate(-10deg) scaleY(.85); } .plant .leaf:nth-child(5) { transform: rotate(12deg) scaleY(.9); }
  .caption { position: absolute; left: 50%; bottom: 4%; transform: translateX(-50%); color: rgba(255,255,255,.95); background: rgba(0,0,0,.45); padding: .6em 1.2em; border-radius: 999px; font-size: 2.2vw; letter-spacing: .02em; }
  .caption:empty { display: none; }
</style>
</head>
<body>
  <div class="scene" id="scene">
    <img class="room" src="{{room}}" alt="" onerror="this.remove()" onload="document.getElementById('scene').classList.add('has-room')">
    <div class="wall-shade"></div>
    <div class="skirting"></div>
    <div class="floor"></div>
    <div class="plant"><div class="pot"></div><div class="leaf"></div><div class="leaf"></div><div class="leaf"></div><div class="leaf"></div></div>
    <div class="frame"><div class="mat">
      <img src="{{poster}}" alt="Poster" onerror="this.outerHTML='<div class=&quot;placeholder&quot;>Limitless Poster</div>'">
    </div></div>
    <div class="caption">{{caption}}</div>
  </div>
</body>
</html>
