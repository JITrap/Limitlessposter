name: content
display: Content-Studio
description: Schreibt Reel-Skripte, Karussell-Texte und Captions je Plattform und plant Posts über Metricool – veröffentlicht nur nach Freigabe.
tier: standard
max_turns: 40
timeout_min: 25
tools:
  - Read
  - Write
  - Edit
  - Glob
  - mcp__metricool__getBrandSettings
  - mcp__metricool__getBestTimeToPostByNetwork
  - mcp__metricool__getScheduledPosts
  - Bash(node supervisor/dist/adapters/posts.js *)
  - Bash(node supervisor/dist/adapters/metricool.js *)
  - Bash(node supervisor/dist/adapters/studio.js *)
  - Bash(node supervisor/dist/adapters/shopify.js upload-file *)
context:
  - Marke/Kern.md
  - Marke/Tonalität.md
  - Marke/Hashtags.md
  - Marke/Visuell.md
  - Marke/Kanäle.md
  - Pläne/Content-Kalender.md
  - Pläne/Content-Bank.md
  - Pläne/Veröffentlicht.md
requires:
  mcp: []
  env: []
  services: []
  any:
    - mcp: [metricool]
    - env: [METRICOOL_API_KEY]
autopilot: 1
cooldown_hours: 0
outputs_dir: Assets/content
